<!doctype html>
<meta charset="utf-8">
<title>formControl validation tests</title>
<pre id="results">Running…</pre>
<script type="module">
  import { formControl } from '../src/forms/form.js'

  const results = document.querySelector('#results')
  const lines = []
  let failures = 0
  const assert = (condition, message) => {
    if (!condition) throw new Error(message)
  }
  const fire = (element, event) => element.dispatchEvent(new Event(event, { bubbles: true }))
  const invalid = (question) => question.question.hasAttribute('data-invalid')

  const test = (name, run, defaultValidators = true) => {
    const form = document.createElement('form')
    form.action = `${location.origin}/?cmd=form_edit`
    form.innerHTML = `
      <div class="form_question"><label>Reason</label><input></div>
      <div class="form_question"><label>Other</label><input></div>
      <div class="actions">
        <button type="button"><span>Dismiss</span></button>
        <button type="button">Another</button>
      </div>
      <button type="button" class="default">Save</button>
    `
    document.body.append(form)
    try {
      const control = formControl(form)
      const question = control._questions.get('Reason')
      const other = control._questions.get('Other')
      const cleanupOrder = []
      let validations = 0
      if (defaultValidators) {
        question.addValidator(() => {
          validations++
          return ['Required', () => cleanupOrder.push('message')]
        }, () => cleanupOrder.push('generic'))
        other.addValidator(() => 'Other is required')
      }
      run({
        form, question, other, cleanupOrder,
        validations: () => validations,
        buttons: form.querySelectorAll('.actions button'),
      })
      lines.push(`PASS ${name}`)
    } catch (error) {
      failures++
      lines.push(`FAIL ${name}: ${error.message}`)
    } finally {
      form.remove()
    }
  }

  test('custom click clears only its question and runs cleanup once', ({ question, other, buttons, cleanupOrder, validations }) => {
    question.clearErrorsOn(buttons[0], 'click')
    question.validate()
    other.validate()
    fire(buttons[0], 'click')
    assert(!invalid(question), 'Question remained invalid')
    assert(invalid(other), 'Unrelated question was cleared')
    assert(!question.input.hasAttribute('aria-invalid'), 'aria-invalid remained')
    assert(question.question.querySelector('[data-control="error"]').textContent === '', 'Error text remained')
    assert(cleanupOrder.join(',') === 'message,generic', 'Cleanup order or count differed')
    fire(buttons[0], 'click')
    fire(question.input, 'input')
    assert(cleanupOrder.length === 2, 'Cleanup repeated without new errors')
    assert(validations() === 1, 'Clearing reran validation')
  })

  test('registration persists across validation attempts and manual clearing', ({ question, buttons, cleanupOrder }) => {
    question.clearErrorsOn(buttons[0], 'click')
    for (let cycle = 0; cycle < 3; cycle++) {
      question.validate()
      fire(buttons[0], 'click')
      assert(!invalid(question), 'Trigger stopped clearing')
    }
    question.validate()
    question.clearErrors()
    question.validate()
    fire(buttons[0], 'click')
    assert(!invalid(question) && cleanupOrder.length === 10, 'Manual clearing removed registration')
  })

  test('NodeList targets and multiple event names work', ({ question, buttons }) => {
    question.clearErrorsOn(buttons, ['input', 'change'])
    for (const button of buttons) {
      for (const event of ['input', 'change']) {
        question.validate()
        fire(button, event)
        assert(!invalid(question), `${event} failed on collection target`)
      }
    }
  })

  test('unregistered input and change events preserve errors and cleanup', ({ question, cleanupOrder }) => {
    question.validate()
    for (const event of ['input', 'change']) {
      fire(question.input, event)
      assert(invalid(question), `${event} implicitly cleared errors`)
      assert(question.input.getAttribute('aria-invalid') === 'true', 'Invalid attribute was cleared')
      assert(question.question.querySelector('[data-control="error"]').textContent === 'Required', 'Error message was cleared')
      assert(cleanupOrder.length === 0, 'Unregistered event ran cleanup')
    }
  })

  test('default event names work on explicitly registered elements', ({ question, buttons }) => {
    question.clearErrorsOn(buttons[0])
    question.clearErrorsOn(question.input)
    for (const element of [buttons[0], question.input]) {
      for (const event of ['input', 'change']) {
        question.validate()
        fire(element, event)
        assert(!invalid(question), `${event} failed`)
      }
    }
  })

  test('container handles bubbling events from descendants', ({ form, question, buttons }) => {
    question.clearErrorsOn(form.querySelector('.actions'), 'click')
    question.validate()
    fire(buttons[0].firstElementChild, 'click')
    assert(!invalid(question), 'Descendant click did not clear errors')
  })

  test('unsubscribe preserves errors and other registrations', ({ question, buttons, cleanupOrder }) => {
    const unsubscribe = question.clearErrorsOn(buttons[0], 'click')
    const unsubscribeOther = question.clearErrorsOn(buttons[0], 'click')
    unsubscribe()
    unsubscribe()
    question.validate()
    fire(buttons[0], 'click')
    assert(!invalid(question), 'Unsubscribe removed overlapping registration')
    question.validate()
    unsubscribeOther()
    assert(invalid(question) && cleanupOrder.length === 2, 'Unsubscribe cleared errors')
    fire(buttons[0], 'click')
    assert(invalid(question), 'Unsubscribed listener still active')
    fire(question.input, 'change')
    assert(invalid(question), 'Unregistered input cleared errors')
  })

  test('unsubscribing original input disables its clearing across validation cycles', ({ question }) => {
    const unsubscribe = question.clearErrorsOn(question.input)
    question.validate()
    unsubscribe()
    fire(question.input, 'input')
    assert(invalid(question), 'Unsubscribed input listener still cleared errors')
    question.validate()
    fire(question.input, 'change')
    assert(invalid(question), 'Revalidation restored implicit clearing')
  })

  test('invalid arguments fail before binding any listeners', ({ question, buttons }) => {
    const invalidArgs = [
      [null, 'click'],
      [[], 'click'],
      [[buttons[0], null], 'click'],
      ['#selector', 'click'],
      [buttons[0], []],
      [buttons[0], ['click', '']],
      [buttons[0], ['click', null]],
      [buttons[0], 'click change'],
    ]
    for (const args of invalidArgs) {
      let threw = false
      try { question.clearErrorsOn(...args) } catch (error) {
        threw = error instanceof TypeError
      }
      assert(threw, 'Expected TypeError')
    }
    question.validate()
    fire(buttons[0], 'click')
    assert(invalid(question), 'Invalid registration left a listener behind')
  })

  test('test requires explicit true and receives the event context', ({ question, buttons, cleanupOrder }) => {
    let result = false
    let context
    question.clearErrorsOn(buttons[0], 'click', {
      test: (value) => { context = value; return result },
      onClear: () => cleanupOrder.push('custom'),
    })
    question.validate()
    for (const value of [false, undefined, null, 1, 'true', Promise.resolve(true)]) {
      result = value
      fire(buttons[0], 'click')
      assert(invalid(question) && cleanupOrder.length === 0, 'Non-true result cleared errors')
    }
    result = true
    fire(buttons[0].firstElementChild, 'click')
    assert(context.target === buttons[0], 'Missing registered target')
    assert(context.event.target === buttons[0].firstElementChild, 'Missing event target')
    assert(context.input === question.input && context.question === question.question && context.label === question.label, 'Missing question context')
    assert(!invalid(question) && cleanupOrder.join(',') === 'message,generic,custom', 'Expected cleanup after successful test')
  })

  test('custom cleanup runs once on every clearing path', ({ question, buttons, cleanupOrder }) => {
    question.clearErrorsOn(buttons[0], 'click', {
      test: () => false,
      onClear: () => cleanupOrder.push('custom'),
    })
    question.clearErrorsOn(question.input)
    for (const clear of [
      () => question.clearErrors(),
      () => fire(question.input, 'input'),
      () => fire(question.input, 'change'),
      () => question.validate(),
    ]) {
      question.validate()
      cleanupOrder.length = 0
      clear()
      assert(cleanupOrder.join(',') === 'message,generic,custom', 'Cleanup did not run in order')
      question.clearErrors()
      const count = cleanupOrder.length
      question.clearErrors()
      assert(cleanupOrder.length === count, 'Cleanup repeated without errors')
    }
  })

  test('cleanup synchronizes attributes even when another trigger clears', ({ question, buttons }) => {
    const custom = buttons[0]
    question.clearErrorsOn(custom, 'click', {
      test: () => false,
      onClear: () => {
        custom.removeAttribute('aria-invalid')
        custom.removeAttribute('data-invalid')
      },
    })
    question.clearErrorsOn(buttons[1], 'click')
    question.validate()
    custom.setAttribute('aria-invalid', 'true')
    custom.setAttribute('data-invalid', '')
    fire(custom, 'click')
    assert(invalid(question) && custom.hasAttribute('data-invalid'), 'Failed test changed errors')
    fire(buttons[1], 'click')
    assert(!custom.hasAttribute('data-invalid') && !custom.hasAttribute('aria-invalid'), 'Attributes remained after another trigger cleared')
  })

  test('unsubscribe removes only its cleanup, even with a shared callback', ({ question, buttons }) => {
    let cleanups = 0
    const onClear = () => cleanups++
    const unsubscribe = question.clearErrorsOn(buttons[0], 'click', { onClear })
    question.clearErrorsOn(buttons[0], 'click', { onClear })
    question.validate()
    unsubscribe()
    unsubscribe()
    assert(cleanups === 0, 'Unsubscribe invoked cleanup')
    fire(buttons[0], 'click')
    assert(cleanups === 1, 'Other registration cleanup was removed or duplicated')
    question.validate()
    question.clearErrors()
    assert(cleanups === 2, 'Cleanup did not persist for the next cycle')
  })

  test('original input respects its predicate and callbacks stay idle without errors', ({ question }) => {
    let tests = 0
    let cleanups = 0
    let allowClear = false
    question.clearErrorsOn(question.input, 'change', {
      test: () => { tests++; return allowClear },
      onClear: () => cleanups++,
    })
    fire(question.input, 'change')
    question.clearErrors()
    assert(tests === 0 && cleanups === 0, 'Callbacks ran without errors')
    question.validate()
    fire(question.input, 'change')
    assert(invalid(question) && tests === 1 && cleanups === 0, 'Failed predicate did not preserve errors')
    allowClear = true
    fire(question.input, 'change')
    assert(!invalid(question) && tests === 2 && cleanups === 1, 'Passing predicate did not clear errors')
  })

  test('invalid callbacks fail before registering listeners or cleanup', ({ question, buttons }) => {
    let cleanups = 0
    for (const options of [
      { test: false, onClear: () => cleanups++ },
      { test: () => true, onClear: 'invalid' },
    ]) {
      let threw = false
      try { question.clearErrorsOn(buttons[0], 'click', options) } catch (error) {
        threw = error instanceof TypeError
      }
      assert(threw, 'Expected TypeError')
    }
    question.validate()
    fire(buttons[0], 'click')
    assert(invalid(question), 'Invalid registration left a listener')
    question.clearErrors()
    assert(cleanups === 0, 'Invalid registration left cleanup')
  })

  const lifecycleTest = (name, run) => test(name, run, false)
  const message = (question) => question.question.querySelector('[data-control="error"]').textContent

  lifecycleTest('blur validates only its owner, including before submission', ({ question, other }) => {
    let ownerCalls = 0
    let siblingCalls = 0
    let otherCalls = 0
    question.addValidator(() => { ownerCalls++; return 'Required' }, {
      validateWhen: [{ targets: [question.input], events: ['blur'] }],
    })
    question.addValidator(() => { siblingCalls++; return 'Sibling' })
    other.addValidator(() => { otherCalls++; return 'Other' })
    fire(question.input, 'input')
    assert(ownerCalls === 0, 'Unregistered event validated')
    fire(question.input, 'blur')
    assert(ownerCalls === 1 && siblingCalls === 0 && otherCalls === 0, 'Blur validated unrelated rules')
    assert(message(question) === 'Required' && invalid(question), 'Blur did not display the error')
  })

  lifecycleTest('submit still runs every rule on a question and stops at first failing question', ({ form, question, other }) => {
    const calls = []
    let pass = false
    question.addValidator(() => { calls.push('first'); return pass || 'First' }, {
      validateWhen: [{ targets: [question.input], events: ['blur'], when: () => false }],
    })
    question.addValidator(() => { calls.push('second'); return true })
    other.addValidator(() => { calls.push('other'); return true })
    const click = () => form.querySelector('button.default').dispatchEvent(new MouseEvent('click', { bubbles: true, cancelable: true }))
    assert(click() === false, 'Invalid submission was not blocked')
    assert(calls.join(',') === 'first,second', 'Submission ordering changed')
    calls.length = 0
    pass = true
    assert(click() === true, 'Valid submission was blocked')
    assert(calls.join(',') === 'first,second,other', 'Submission skipped a valid question')
  })

  lifecycleTest('clearing one validator preserves sibling errors and invalid attributes', ({ question, buttons }) => {
    const cleanups = []
    question.addValidator(() => 'First', {
      clearErrorsWhen: [{ targets: [buttons[0]], onClear: () => {
        cleanups.push('first')
        question.input.removeAttribute('aria-invalid')
      } }],
    })
    question.addValidator(() => 'Second', {
      clearErrorsWhen: [{ targets: [buttons[1]], onClear: () => cleanups.push('second') }],
    })
    assert(question.validate() === false && message(question) === 'First, Second', 'Errors were not aggregated')
    fire(buttons[0], 'input')
    assert(message(question) === 'Second' && invalid(question), 'Sibling error was hidden')
    assert(question.input.getAttribute('aria-invalid') === 'true', 'Input invalid state was removed')
    assert(cleanups.join(',') === 'first', 'Sibling cleanup ran')
    fire(buttons[1], 'change')
    assert(!invalid(question) && !question.input.hasAttribute('aria-invalid'), 'Final error did not clear')
    assert(cleanups.join(',') === 'first,second', 'Cleanup order differed')
  })

  lifecycleTest('revalidation clears only the owner and refreshes messages in registration order', ({ question }) => {
    let value = 'First'
    let secondCalls = 0
    const order = []
    question.addValidator(() => { order.push('validate'); return value }, {
      validateWhen: [{ targets: [question.input], events: ['blur'] }],
      clearErrorsWhen: [{ onClear: () => order.push('clear') }],
      onValid: () => question.input.removeAttribute('aria-invalid'),
    })
    question.addValidator(() => { secondCalls++; return 'Second' })
    question.validate()
    order.length = 0
    value = 'Updated'
    fire(question.input, 'blur')
    assert(order.join(',') === 'clear,validate', 'Old result was not cleaned before validating')
    assert(message(question) === 'Updated, Second' && secondCalls === 1, 'Sibling was rerun or messages were reordered')
    value = true
    fire(question.input, 'blur')
    assert(message(question) === 'Second' && invalid(question), 'Valid owner cleared sibling error')
    assert(question.input.getAttribute('aria-invalid') === 'true', 'Valid callback hid sibling invalid state')
  })

  lifecycleTest('when predicates gate only event triggers and require explicit true', ({ question, buttons }) => {
    let allow = false
    let calls = 0
    let details
    question.addValidator(() => { calls++; return 'Required' }, {
      validateWhen: [{ targets: [buttons[0]], events: ['click'], when: (ctx) => { details = ctx; return allow } }],
      clearErrorsWhen: [{ targets: [buttons[1]], events: ['click'], when: () => allow }],
    })
    for (const value of [false, null, undefined, 1, 'true', Promise.resolve(true)]) {
      allow = value
      fire(buttons[0], 'click')
      assert(calls === 0, 'Non-true predicate triggered validation')
    }
    allow = true
    fire(buttons[0].firstElementChild, 'click')
    assert(calls === 1 && invalid(question), 'True predicate did not validate')
    assert(details.target === buttons[0] && details.event.target === buttons[0].firstElementChild && details.input === question.input, 'Incorrect trigger context')
    allow = false
    fire(buttons[1], 'click')
    assert(invalid(question), 'False clearing predicate cleared errors')
    question.validate()
    assert(calls === 2, 'Event predicate blocked manual validation')
    allow = true
    fire(buttons[1], 'click')
    assert(!invalid(question) && calls === 2, 'Clearing ran validation')
  })

  lifecycleTest('result callbacks fire on each attempt with isolated result messages', ({ form, question }) => {
    const results = []
    let result = 'Required'
    question.addValidator(() => result, {
      validateWhen: [{ targets: [question.input], events: ['blur'] }],
      onInvalid: (details) => { results.push(details); details.messages.push('mutated') },
      onValid: (details) => results.push(details),
    })
    fire(question.input, 'blur')
    fire(question.input, 'blur')
    assert(results.length === 2 && !results[0].valid && !results[1].valid, 'Invalid callback did not run for each attempt')
    assert(message(question) === 'Required', 'Callback mutated stored messages')
    result = true
    question.validate()
    form.querySelector('button.default').click()
    assert(results.length === 4 && results[2].valid && results[3].valid, 'Valid callback skipped manual or submit validation')
    assert(results[2].messages.length === 0 && results[2].event === null && results[2].target === null, 'Incorrect manual result context')
  })

  lifecycleTest('each cleanup runs once per owner error cycle on manual clear and replacement', ({ question }) => {
    const order = []
    let passingCleanup = 0
    question.addValidator(() => ['Required', () => order.push('message')], {
      clearErrorsWhen: [
        { onClear: () => order.push('first') },
        { onClear: () => order.push('second') },
      ],
    })
    question.addValidator(() => true, { clearErrorsWhen: [{ onClear: () => passingCleanup++ }] })
    question.clearErrors()
    assert(!order.length, 'Cleanup ran before errors existed')
    question.validate()
    question.validate()
    assert(order.join(',') === 'message,first,second', 'Replacement cleanup differed')
    question.clearErrors()
    question.clearErrors()
    assert(order.join(',') === 'message,first,second,message,first,second', 'Cleanup repeated without new errors')
    assert(passingCleanup === 0, 'Passing validator cleanup ran for another validator')
  })

  lifecycleTest('cleanup-only configurations and multiple targets and event overrides work', ({ question, buttons }) => {
    let cleanups = 0
    question.addValidator(() => 'Required', {
      clearErrorsWhen: [
        { targets: buttons, events: ['click'] },
        { onClear: () => cleanups++ },
      ],
    })
    question.validate()
    fire(buttons[0], 'input')
    assert(invalid(question), 'Overridden event was still registered')
    for (const button of buttons) {
      question.validate()
      fire(button, 'click')
      assert(!invalid(question), 'Collection target failed')
    }
    assert(cleanups === 3, 'Cleanup-only configuration did not run')
  })

  lifecycleTest('validation wins when the same target and event also clear errors', ({ question }) => {
    let calls = 0
    question.addValidator(() => { calls++; return 'Required' }, {
      validateWhen: [
        { targets: [question.input], events: ['input'] },
        { targets: [question.input], events: ['input'] },
      ],
      clearErrorsWhen: [{ targets: [question.input] }],
    })
    fire(question.input, 'input')
    assert(calls === 1 && invalid(question), 'Validation was duplicated or its error was immediately hidden')
    fire(question.input, 'change')
    assert(calls === 1 && !invalid(question), 'Clearing-only event did not clear')
  })

  lifecycleTest('options are validated atomically before state or listeners are added', ({ question }) => {
    let calls = 0
    const validTrigger = { targets: [question.input], events: ['blur'] }
    const invalidOptions = [
      { validateWhen: [validTrigger, { targets: [question.input] }] },
      { validateWhen: validTrigger },
      { validateWhen: [null] },
      { validateWhen: [{ targets: [], events: ['blur'] }] },
      { validateWhen: [{ ...validTrigger, when: true }] },
      { validateWhen: [{ ...validTrigger, events: ['blur change'] }] },
      { validateWhen: [validTrigger], clearErrorsWhen: [{ targets: ['invalid'] }] },
      { clearErrorsWhen: [{ onClear: false }] },
      { onValid: 'invalid' },
      { onInvalid: true },
    ]
    for (const options of invalidOptions) {
      let threw = false
      try { question.addValidator(() => { calls++; return 'Invalid' }, options) } catch (error) {
        threw = error instanceof TypeError
      }
      assert(threw, 'Expected invalid options to throw TypeError')
    }
    fire(question.input, 'blur')
    assert(question.validate() && calls === 0, 'Invalid options left a validator or listener behind')
  })

  lifecycleTest('legacy question-wide clearing still clears all rule errors and cleanup', ({ question }) => {
    let legacyCleanup = 0
    let ruleCleanup = 0
    let wideCleanup = 0
    question.addValidator(() => 'Legacy', () => legacyCleanup++)
    question.addValidator(() => 'New', {
      clearErrorsWhen: [{ targets: [question.input], onClear: () => ruleCleanup++ }],
    })
    const unsubscribe = question.clearErrorsOn(question.input, 'change', { onClear: () => wideCleanup++ })
    question.validate()
    fire(question.input, 'input')
    assert(message(question) === 'Legacy' && ruleCleanup === 1 && wideCleanup === 0, 'Rule clear was not isolated')
    fire(question.input, 'change')
    assert(!invalid(question) && legacyCleanup === 1 && wideCleanup === 1, 'Legacy question-wide clear failed')
    unsubscribe()
  })

  results.textContent = `${lines.join('\n')}\n${lines.length - failures}/${lines.length} passed`
  document.documentElement.dataset.testStatus = failures ? 'failed' : 'passed'
</script>
